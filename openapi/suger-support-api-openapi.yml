          description: Internal server error
      security:
      - APIKeyAuth: []
      summary: Get Support Ticket
      tags:
      - Support
    patch:
      description: update support ticket
      operationId: UpdateSupportTicket
      parameters:
      - description: Organization ID
        explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      - description: Ticket ID
        explode: false
        in: path
        name: ticketId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSupportTicketRequest'
        description: Ticket create request
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicket'
          description: OK
        '400':
          content:
            application/json:
              schema:
                type: string
          description: Bad request error
        '500':
          content:
            application/json:
              schema:
                type: string
          description: Internal server error
      security:
      - APIKeyAuth: []
      summary: Update Support Ticket
      tags:
      - Support
      x-codegen-request-body-name: body
