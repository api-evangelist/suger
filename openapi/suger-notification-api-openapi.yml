        notificationMessages:
        - organizationID: organizationID
          creationTime: 2000-01-23 04:56:07+00:00
          recipient: recipient
          id: id
          type: EMAIL
          info:
            standardFields:
              key: ''
            customFields:
              key: ''
            subject: subject
            rccRecipients:
            - rccRecipients
            - rccRecipients
            ccRecipients:
            - ccRecipients
            - ccRecipients
            action: '{}'
            textContent: textContent
            htmlContent: htmlContent
        - organizationID: organizationID
          creationTime: 2000-01-23 04:56:07+00:00
          recipient: recipient
          id: id
          type: EMAIL
          info:
            standardFields:
              key: ''
            customFields:
              key: ''
            subject: subject
            rccRecipients:
            - rccRecipients
            - rccRecipients
            ccRecipients:
            - ccRecipients
            - ccRecipients
            action: '{}'
            textContent: textContent
            htmlContent: htmlContent
        nextOffset: 0
        totalCount: 6
      properties:
        nextOffset:
          description: 'The next offset to use in the next request to get the next page of notification messages.

            If this field is null, there are no more notification messages to get.'
          type: integer
        notificationMessages:
          items:
            $ref: '#/components/schemas/NotificationMessage'
          type: array
        totalCount:
          description: 'The total number of notification messages.

            Only available when the request is made with the first offset = 0.'
          type: integer
      type: object
